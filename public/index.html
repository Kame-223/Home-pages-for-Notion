<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 ホーム</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+JP:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: rgba(255,255,255,0.88);
  --text-sub: rgba(255,255,255,0.45);
  --text-dim: rgba(255,255,255,0.2);
  --purple: #7F77DD;
  --green: #1D9E75;
  --red: #D85A30;
  --amber: #EF9F27;
  --blue: #378ADD;
  --pink: #D4537E;
  --board-today: #161620;
  --board-bottom: #0f0817;
  --board-border-today: rgba(127,119,221,0.2);
  --board-border-bottom: rgba(74,32,96,0.6);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

/* ===== PAGE WRAPPER ===== */
.page-wrapper {
  display: flex;
  width: 70vw;
  min-width: 820px;
  min-height: 100vh;
  align-items: flex-start;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 56px;
  background: var(--surface);
  border-right: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 4px;
  flex-shrink: 0;
  z-index: 10;
  position: sticky;
  top: 0;
  height: 100vh;
  align-self: flex-start;
}
.sb-btn {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: none; background: transparent;
  cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px; transition: all .2s;
  text-decoration: none;
}
.sb-btn:hover { background: rgba(255,255,255,0.06); }
.sb-btn.active { background: rgba(127,119,221,0.15); border: 0.5px solid rgba(127,119,221,0.3); }
.sb-icon { font-size: 16px; }
.sb-label { font-size: 8px; color: var(--text-dim); font-weight: 400; letter-spacing: 0.05em; }
.sb-btn.active .sb-label { color: var(--purple); }

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

/* ===== TOPBAR ===== */
.topbar {
  display: flex;
  align-items: stretch;
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  min-height: 68px;
}
.banner-area {
  flex: 1;
  background: #06040e;
  position: relative;
  overflow: hidden;
  padding: 8px 18px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.banner-orb {
  position: absolute;
  width: 200px; height: 200px;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.12;
  top: -60px; right: 20px;
  transition: background .8s;
}
.banner-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 32px 32px;
}
.banner-content { position: relative; z-index: 1; }
.banner-date { font-size: 9px; letter-spacing: 0.25em; color: var(--text-dim); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
.banner-jp { font-size: 14px; font-weight: 400; color: var(--text); line-height: 1.6; margin-bottom: 4px; }
.banner-en { font-size: 11px; color: var(--text-sub); font-family: 'Cormorant Garamond', serif; font-style: italic; margin-bottom: 6px; }
.banner-phil { font-size: 9px; color: var(--purple); display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em; }
.phil-line { flex: 1; height: 0.5px; background: rgba(127,119,221,0.2); }

.topbar-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px 12px;
  gap: 4px;
  border-left: 0.5px solid var(--border);
  background: var(--surface);
  min-width: 180px;
}
.topbar-info { display: flex; flex-direction: column; gap: 1px; }
.greeting { font-size: 16px; font-weight: 500; color: var(--text); }
.date-str { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
.topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.quick-btn {
  font-size: 10px; padding: 5px 10px; border-radius: 7px;
  border: 0.5px solid var(--border2); background: var(--surface2);
  cursor: pointer; color: var(--text-sub); font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .15s; white-space: nowrap;
}
.quick-btn:hover { border-color: var(--purple); color: var(--purple); }
.mode-btns { display: flex; gap: 4px; }
.mode-btn {
  font-size: 10px; padding: 5px 12px; border-radius: 7px;
  border: 0.5px solid var(--border); background: transparent;
  cursor: pointer; color: var(--text-sub); font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s;
}
.mode-btn.active { background: var(--purple); border-color: var(--purple); color: white; }

/* ===== PROGRESS ===== */
.progress-area {
  display: flex; gap: 6px;
  padding: 5px 12px;
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}
.prog-card {
  flex: 1; background: var(--surface2);
  border-radius: 6px; padding: 5px 10px;
  border: 0.5px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.prog-label { font-size: 9px; color: var(--text-dim); letter-spacing: 0.08em; white-space: nowrap; }
.prog-val { font-size: 13px; font-weight: 500; color: var(--text); font-family: 'JetBrains Mono', monospace; }
.prog-sub { font-size: 9px; color: var(--text-dim); }
.prog-bar { flex: 1; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 1px; transition: width .5s ease; }

/* ===== CONTENT GRID ===== */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
}

/* ===== SCHEDULE ===== */
.schedule-col {
  border-right: 0.5px solid var(--border);
  border-bottom: 0.5px solid var(--border);
  overflow: hidden;
  padding: 10px 8px;
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.col-title { font-size: 8px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.2em; margin-bottom: 8px; }
.cal-iframe-wrap {
  height: 560px;
  overflow: hidden;
  border-radius: 6px;
  border: 0.5px solid var(--border);
  background: var(--surface2);
  position: relative;
}
.cal-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  padding: 20px;
  text-align: center;
}
.cal-placeholder-icon { font-size: 28px; opacity: 0.4; }
.cal-placeholder-text { font-size: 11px; font-weight: 500; color: var(--text-sub); }
.cal-placeholder-sub { font-size: 9px; color: var(--text-dim); line-height: 1.7; }
#cal-iframe {
  width: 100%;
  height: 100%;
  border: none;
  filter: invert(0.88) hue-rotate(180deg) saturate(0.65) brightness(0.85);
}
.cal-slot { display: flex; gap: 5px; margin-bottom: 5px; align-items: flex-start; }
.cal-time { font-size: 9px; color: var(--text-dim); min-width: 30px; padding-top: 3px; font-family: 'JetBrains Mono', monospace; }
.cal-event { flex: 1; font-size: 10px; padding: 3px 6px; border-radius: 4px; line-height: 1.4; }
.ev-class { background: rgba(127,119,221,0.12); color: #AFA9EC; border-left: 2px solid var(--purple); }
.ev-task { background: rgba(29,158,117,0.1); color: #5DCAA5; border-left: 2px solid var(--green); }
.ev-empty { color: var(--text-dim); font-size: 9px; padding-top: 2px; }

/* ===== TODAY BOARD ===== */
.today-board {
  background: var(--board-today);
  border-bottom: 0.5px solid var(--board-border-today);
  padding: 10px 12px;
  min-height: 200px;
}
.today-board::-webkit-scrollbar { width: 3px; }
.today-board::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.board-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.board-title { font-size: 9px; font-weight: 500; color: var(--text-dim); letter-spacing: 0.2em; }

/* ===== BOTTOM SECTION ===== */
.bottom-row {
  grid-column: 1 / 3;
  display: flex;
  flex-direction: column;
}
.bottom-section {
  display: grid;
  grid-template-columns: 1fr 0.5px 1fr;
  background: var(--board-bottom);
  border-top: 0.5px solid var(--board-border-bottom);
  min-height: 200px;
}
.bottom-half { padding: 8px 12px; }
.bottom-divider { background: rgba(74,32,96,0.5); }
.bottom-label-red {
  font-size: 9px; font-weight: 500; color: #F09595;
  letter-spacing: 0.1em; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.bottom-label-blue {
  font-size: 9px; font-weight: 500; color: #85B7EB;
  letter-spacing: 0.1em; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.bottom-label-red::before { content:''; flex:1; height:0.5px; background:rgba(240,149,149,0.2); }
.bottom-label-blue::before { content:''; flex:1; height:0.5px; background:rgba(133,183,235,0.2); }

/* ===== 1日のスケジュール（実行モード下段） ===== */
.day-schedule {
  background: var(--board-bottom);
  border-top: 0.5px solid var(--board-border-bottom);
  overflow-y: auto;
  padding: 10px 12px;
  max-height: 220px;
}
.day-schedule::-webkit-scrollbar { width: 3px; }
.day-schedule::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.time-block { margin-bottom: 12px; }
.time-block-label {
  font-size: 10px; font-weight: 500; color: var(--text-sub);
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.time-block-label::after { content:''; flex:1; height:0.5px; background:var(--border); }

/* ===== TASK CARD ===== */
.task-card {
  background: var(--surface2);
  border: 0.5px solid var(--border2);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 7px;
  position: relative;
  transition: all .2s;
}
.task-card.done { opacity: 0.4; }
.task-card.done .task-title { text-decoration: line-through; color: var(--text-dim); }
.task-card.pinned { border-color: rgba(127,119,221,0.4); }
.task-card.confirmed-dim { opacity: 0.4; border-color: var(--border); }
.pin-badge {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  font-size: 12px; display: none;
}
.task-card.pinned .pin-badge { display: block; }
.tag-row { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; flex-wrap: wrap; }
.tag { font-size: 9px; padding: 2px 7px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
.tag-teal { background: rgba(29,158,117,0.12); color: #5DCAA5; border: 0.5px solid rgba(93,202,165,0.3); }
.tag-blue { background: rgba(55,138,221,0.12); color: #85B7EB; border: 0.5px solid rgba(133,183,235,0.3); }
.tag-amber { background: rgba(239,159,39,0.12); color: #EF9F27; border: 0.5px solid rgba(239,159,39,0.3); }
.tag-pink { background: rgba(212,83,126,0.12); color: #ED93B1; border: 0.5px solid rgba(237,147,177,0.3); }
.tag-purple { background: rgba(127,119,221,0.12); color: #AFA9EC; border: 0.5px solid rgba(175,169,236,0.3); }
.tag-gray { background: rgba(255,255,255,0.05); color: var(--text-sub); border: 0.5px solid var(--border); }
.tag-red { background: rgba(240,149,149,0.12); color: #F09595; border: 0.5px solid rgba(240,149,149,0.3); }
.deadline-tag { margin-left: auto; flex-shrink: 0; }
.task-title { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
.task-bottom { display: flex; align-items: center; gap: 6px; }
.time-wrap { display: flex; align-items: center; gap: 4px; }
.time-btn {
  width: 18px; height: 18px; border-radius: 4px;
  border: 0.5px solid var(--border2); background: rgba(255,255,255,0.04);
  cursor: pointer; font-size: 10px; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
}
.time-btn:active { transform: scale(.9); }
.time-val { font-size: 10px; font-weight: 500; min-width: 26px; text-align: center; color: var(--text-sub); font-family: 'JetBrains Mono', monospace; }
.card-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; }

/* ボタン */
.btn-pin {
  font-size: 10px; padding: 3px 10px; border-radius: 7px;
  border: 0.5px solid rgba(29,158,117,0.4); background: rgba(29,158,117,0.1);
  cursor: pointer; color: #5DCAA5; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s; white-space: nowrap;
}
.btn-pin.pinned { border-color: rgba(240,149,149,0.4); background: rgba(240,149,149,0.1); color: #F09595; }
.btn-time {
  font-size: 10px; padding: 3px 10px; border-radius: 7px;
  border: 0.5px solid rgba(239,159,39,0.3); background: rgba(239,159,39,0.08);
  cursor: pointer; color: #EF9F27; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s; position: relative; white-space: nowrap;
}
.btn-start {
  font-size: 10px; padding: 3px 10px; border-radius: 7px;
  border: 0.5px solid rgba(29,158,117,0.4); background: rgba(29,158,117,0.1);
  cursor: pointer; color: #5DCAA5; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s; white-space: nowrap;
}
.btn-start.restart { border-color: rgba(239,159,39,0.4); background: rgba(239,159,39,0.1); color: #EF9F27; }
.btn-done {
  font-size: 10px; padding: 3px 12px; border-radius: 7px;
  border: none; background: var(--purple);
  cursor: pointer; color: white; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s; white-space: nowrap;
}
.btn-done.undo { background: rgba(255,255,255,0.1); color: var(--text-sub); }

/* 時間帯ドロップダウン */
.time-dropdown {
  position: absolute; bottom: 28px; right: 0;
  background: #1e1e2e; border: 0.5px solid var(--border2);
  border-radius: 8px; overflow: hidden; z-index: 100;
  display: none; min-width: 90px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.time-dropdown.open { display: block; }
.time-opt {
  padding: 7px 12px; font-size: 11px; cursor: pointer;
  color: var(--text-sub); transition: background .15s;
  display: flex; align-items: center; gap: 6px;
}
.time-opt:hover { background: rgba(255,255,255,0.06); color: var(--text); }

/* ===== 集中モード ===== */
.focus-overlay {
  position: fixed; inset: 0;
  background: rgba(5,3,15,0.96);
  display: none; align-items: center; justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(8px);
}
.focus-overlay.open { display: flex; }
.focus-modal {
  display: flex; flex-direction: column;
  align-items: center; gap: 16px;
  padding: 48px 40px;
  max-width: 420px; width: 100%;
  animation: fadeUp .3s ease-out;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
.focus-mode-label {
  font-size: 9px; letter-spacing: 0.4em; color: var(--text-dim);
  text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
}
.focus-tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.focus-task { font-size: 20px; font-weight: 400; color: var(--text); text-align: center; line-height: 1.5; }
.focus-link {
  font-size: 11px; color: var(--purple); text-decoration: none;
  padding: 5px 14px; border-radius: 99px;
  border: 0.5px solid rgba(127,119,221,0.3);
  background: rgba(127,119,221,0.08);
  display: none;
}
.focus-link.show { display: block; }
.focus-expected { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
.focus-timer {
  font-size: 52px; font-weight: 300; color: var(--text);
  font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
}
.focus-timer.warning { color: var(--amber); }
.focus-btns { display: flex; gap: 10px; margin-top: 8px; }
.focus-pause {
  font-size: 12px; padding: 10px 24px; border-radius: 10px;
  border: 0.5px solid var(--border2); background: transparent;
  cursor: pointer; color: var(--text-sub); font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s;
}
.focus-pause:hover { background: rgba(255,255,255,0.05); color: var(--text); }
.focus-done-btn {
  font-size: 12px; padding: 10px 28px; border-radius: 10px;
  border: none; background: var(--purple);
  cursor: pointer; color: white; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; transition: all .2s;
}
.focus-done-btn:hover { background: #6B63C7; }

/* モーダル */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 500;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface2); border: 0.5px solid var(--border2);
  border-radius: 16px 16px 0 0; padding: 20px;
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 10px;
}
.modal-title { font-size: 13px; font-weight: 500; }
.modal-input {
  width: 100%; background: var(--surface);
  border: 0.5px solid var(--border2); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
}
.modal-input:focus { outline: none; border-color: var(--purple); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel {
  padding: 6px 14px; border-radius: 8px;
  border: 0.5px solid var(--border2); background: transparent;
  cursor: pointer; font-size: 11px; color: var(--text-sub);
  font-family: 'Noto Sans JP', sans-serif;
}
.btn-save {
  padding: 6px 14px; border-radius: 8px;
  border: none; background: var(--purple);
  cursor: pointer; font-size: 11px; color: white;
  font-family: 'Noto Sans JP', sans-serif; font-weight: 500;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  display: flex; gap: 8px; padding: 6px 12px;
  border-top: 0.5px solid var(--border);
  background: var(--bg); flex-shrink: 0;
  justify-content: center;
}
.nav-btn {
  padding: 8px 20px; border-radius: 8px;
  border: 0.5px solid var(--border2);
  background: var(--surface);
  cursor: pointer; text-align: center;
  font-size: 10px; color: var(--text-sub); font-weight: 500;
  font-family: 'Noto Sans JP', sans-serif; transition: all .15s;
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
  letter-spacing: 0.05em;
}
.nav-btn:hover { background: var(--surface2); border-color: var(--purple); color: var(--purple); }

.loading { font-size: 11px; color: var(--text-dim); text-align: center; padding: 16px; }
.hidden { display: none; }
.section-empty { font-size: 10px; color: var(--text-dim); text-align: center; padding: 12px; }

/* スクロールバー全体 */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>
<div class="page-wrapper">

<!-- サイドバー -->
<div class="sidebar">
  <a class="sb-btn active" href="#"><span class="sb-icon">🏠</span><span class="sb-label">Home</span></a>
  <a class="sb-btn" href="https://www.notion.so/3294c1ec140d838499ae0131fc67976d" target="_blank"><span class="sb-icon">📋</span><span class="sb-label">Task</span></a>
  <a class="sb-btn" href="https://www.notion.so/8584c1ec140d83b29e26019b60fe7a3e" target="_blank"><span class="sb-icon">🗂</span><span class="sb-label">Project</span></a>
  <a class="sb-btn" href="https://www.notion.so/ede1fe04ef4948d49d525d24868b9858" target="_blank"><span class="sb-icon">📝</span><span class="sb-label">Note</span></a>
  <a class="sb-btn" href="https://www.notion.so/3524c1ec140d8127a9a2c7c3aae1d99b" target="_blank"><span class="sb-icon">📚</span><span class="sb-label">資料</span></a>
</div>

<!-- メイン -->
<div class="main">

  <!-- トップバー -->
  <div class="topbar">
    <div class="banner-area">
      <div class="banner-orb" id="banner-orb"></div>
      <div class="banner-grid"></div>
      <div class="banner-content">
        <div class="banner-date" id="banner-date"></div>

<script>
// ===== Google Calendar 設定 =====
const GCAL_IDS = [

// ===== DB IDs =====
const DB = {
  tasks: '3294c1ec140d838499ae0131fc67976d',
  projects: '8584c1ec140d83b29e26019b60fe7a3e',
};

// ===== 哲学バナー =====
const quotes = [
  {jp:"私は思う、ゆえに私は在る。",en:'"I think, therefore I am."',phil:"René Descartes",color:"#7F77DD"},

  {jp:"心の平和は外からは得られない。",en:'"Peace comes from within."',phil:"Buddha",color:"#1D9E75"},
  {jp:"苦しみは人を強くする。選ぶのは自分だ。",en:'"Pain is inevitable. Suffering is optional."',phil:"Haruki Murakami",color:"#D85A30"},
];

function setupBanner() {
  const now = new Date();

  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('banner-date').textContent =
    `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${days[now.getDay()]}`;
  document.getElementById('banner-jp').textContent = q.jp;
  document.getElementById('banner-en').textContent = q.en;

function setupHeader() {
  const h = new Date().getHours();
  document.getElementById('greeting').textContent = h<12?'おはよう':h<18?'こんにちは':'こんばんは';
  const now = new Date();
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('date-str').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${days[now.getDay()]}）`;
}

// ===== カレンダー =====
function setupCalendar() {
  if (!GCAL_IDS.length) return;
  const iframe = document.getElementById('cal-iframe');
  const placeholder = document.getElementById('cal-placeholder');
  const srcParams = GCAL_IDS.map(id => `src=${encodeURIComponent(id)}`).join('&');
  const today = new Date();
  const d = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  iframe.src = `https://calendar.google.com/calendar/embed?${srcParams}&ctz=Asia%2FTokyo&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&mode=DAY&dates=${d}%2F${d}`;
  iframe.style.display = 'block';
  if (placeholder) placeholder.style.display = 'none';
}

// ===== API =====
async function notionQuery(dbId, filter, sorts) {
  const body = {};
  if (filter) body.filter = filter;
  if (sorts) body.sorts = sorts;
  const res = await fetch(`/api/notion?path=databases/${dbId}/query`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

async function notionUpdate(pageId, properties) {
  const res = await fetch(`/api/notion?path=pages/${pageId}`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({properties}),
  });
  if (!res.ok) throw new Error(`Update failed ${res.status}`);
  return res.json();
}

async function notionCreate(dbId, properties) {
  const res = await fetch('/api/notion?path=pages', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({parent:{database_id:dbId}, properties}),
  });
  if (!res.ok) throw new Error(`Create failed ${res.status}`);
  return res.json();
}

// ===== ユーティリティ =====
function getProp(page, name) {
  const p = page.properties[name];
  if (!p) return null;
  if (p.type==='title') return p.title.map(t=>t.plain_text).join('');
  if (p.type==='rich_text') return p.rich_text.map(t=>t.plain_text).join('');
  if (p.type==='status') return p.status?.name||null;
  if (p.type==='select') return p.select?.name||null;
  if (p.type==='multi_select') return p.multi_select.map(s=>s.name);
  if (p.type==='date') return p.date?.start||null;
  if (p.type==='formula') return p.formula?.string||p.formula?.number||null;
  if (p.type==='url') return p.url||null;
  return null;
}

function deadlineTag(dateStr) {
  if (!dateStr) return null;
  const diff = Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  if (diff < 0) return {label:'期限切れ', cls:'tag-red'};
  if (diff === 0) return {label:'今日締切', cls:'tag-red'};
  if (diff <= 3) return {label:`${diff}日後`, cls:'tag-amber'};
  if (diff <= 7) return {label:`${diff}日後`, cls:'tag-blue'};
  return {label:`${diff}日後`, cls:'tag-gray'};
}

function areaTag(area, subjects) {
  if (area==='課題') {
    if (subjects?.length) {
      const s = subjects[0];
      if (s==='憲法') return {label:'憲法', cls:'tag-teal'};
      if (s==='社会学') return {label:'社会学', cls:'tag-blue'};
      if (s==='教育原理') return {label:'教育原理', cls:'tag-purple'};
      if (s==='ELA') return {label:'ELA', cls:'tag-amber'};
    }
    return {label:'課題', cls:'tag-teal'};
  }
  if (area==='ICU') return {label:'ICU', cls:'tag-amber'};
  if (area==='個人') return {label:'個人', cls:'tag-pink'};
  if (area==='生活') return {label:'生活', cls:'tag-blue'};
  return {label:area||'—', cls:'tag-gray'};
}

// ===== タスクデータ =====
let allTasks = [];
const timeSteps = ['5m','30m','1h','2h','3h+'];
const taskState = {};

async function loadTasks() {
  try {
    const data = await notionQuery(DB.tasks, {
      property:'GTD 種別', status:{does_not_equal:'🗑ゴミ箱'}
    }, [{property:'締切日', direction:'ascending'}]);
    allTasks = data.results;
    renderAll();
    updateProgress();
  } catch(e) {
    console.error('loadTasks:', e);
    ['today-tasks','leftover-list','next-list'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<div class="loading" style="color:#F09595">読み込みエラー</div>';
    });
  }
}

// ===== タスクカード描画 =====
function renderCard(task, mode='today') {
  const id = task.id;
  const title = getProp(task,'タイトル') || '無題';
  const area = getProp(task,'エリア');
  const subjects = getProp(task,'科目') || [];
  const ela = getProp(task,'ELAサブタグ');
  const deadline = getProp(task,'締切日');
  const soyo = getProp(task,'所要時間');
  const jikantai = getProp(task,'実行時間帯');
  const link = getProp(task,'作業リンク');
  const gtd = getProp(task,'GTD 種別');

  if (!taskState[id]) taskState[id] = {
    done: false, pinned: false,
    timeIdx: timeSteps.indexOf(soyo||'30m') >= 0 ? timeSteps.indexOf(soyo||'30m') : 1,
    focusSeconds: 0, jikantai: jikantai||null, link: link||null,
  };
  const s = taskState[id];

  const at = areaTag(area, subjects);
  const dt = deadlineTag(deadline);

  const tagsHtml = [
    `<span class="tag ${at.cls}">${at.label}</span>`,
    ela ? `<span class="tag tag-amber">${ela}</span>` : '',
    dt ? `<span class="tag ${dt.cls} deadline-tag">${dt.label}</span>` : '',
  ].filter(Boolean).join('');

  const timeBlockHtml = s.jikantai ?
    `<span class="tag tag-gray">${s.jikantai==='午前'?'🌅':s.jikantai==='午後'?'🌇':'🌙'} ${s.jikantai}</span>` : '';

  if (mode === 'leftover' || mode === 'next') {
    return `
    <div class="task-card ${s.pinned?'confirmed-dim':''} ${s.done?'done':''}" id="tc-${id}" style="margin-bottom:6px">
      <div class="pin-badge">📌</div>
      <div class="tag-row">${tagsHtml}</div>
      <div class="task-title" id="tt-${id}">${title}</div>
      <div class="task-bottom">
        <div class="time-wrap">
          <button class="time-btn" onclick="chTime('${id}',-1)">−</button>
          <span class="time-val" id="tv-${id}">${timeSteps[s.timeIdx]}</span>
          <button class="time-btn" onclick="chTime('${id}',1)">＋</button>
        </div>
        <div class="card-actions">
          <button class="btn-pin ${s.pinned?'pinned':''}" id="pin-${id}" onclick="togglePin('${id}')">${s.pinned?'取り消し':'今日する'}</button>
        </div>
      </div>
    </div>`;
  }

  // today / exec mode
  return `
  <div class="task-card ${s.pinned?'pinned':''} ${s.done?'done':''}" id="tc-${id}">
    <div class="pin-badge" onclick="togglePin('${id}')" style="cursor:pointer;title='TODAYから外す'">📌</div>
    <div class="tag-row">${tagsHtml}${timeBlockHtml}</div>
    <div class="task-title" id="tt-${id}">${title}</div>
    <div class="task-bottom">
      <div class="time-wrap">
        <button class="time-btn" onclick="chTime('${id}',-1)">−</button>
        <span class="time-val" id="tv-${id}">${timeSteps[s.timeIdx]}</span>
        <button class="time-btn" onclick="chTime('${id}',1)">＋</button>
      </div>
      <div class="card-actions">
        <div style="position:relative">
          <button class="btn-time" id="timetag-${id}" onclick="toggleTimeDropdown('${id}')">${s.jikantai||'時間帯'}</button>
          <div class="time-dropdown" id="tdd-${id}">
            <div class="time-opt" onclick="setJikantai('${id}','午前')">🌅 午前</div>
            <div class="time-opt" onclick="setJikantai('${id}','午後')">🌇 午後</div>
            <div class="time-opt" onclick="setJikantai('${id}','夜')">🌙 夜</div>
          </div>
        </div>
        <button class="btn-start ${s.focusSeconds>0?'restart':''}" id="start-${id}" onclick="startFocus('${id}')">${s.focusSeconds>0?'Restart':'Start'}</button>
        <button class="btn-done ${s.done?'undo':''}" id="done-${id}" onclick="toggleDone('${id}')">${s.done?'取り消し':'完了'}</button>
      </div>
    </div>
  </div>`;
}

function renderAll() {
  const today = new Date().toISOString().split('T')[0];
  const gtdNext = t => {const g=getProp(t,'GTD 種別'); return g==='▶️ 次やる';};
  const isDone = t => taskState[t.id]?.done || getProp(t,'ステータス')==='完了';

  // TODAY（明示的に「今日やる」を押したタスクのみ）
  const todayTasks = allTasks.filter(t => !isDone(t) && taskState[t.id]?.pinned);
  const todayEl = document.getElementById('today-tasks');
  todayEl.innerHTML = todayTasks.length
    ? todayTasks.map(t=>renderCard(t,'today')).join('')
    : '<div class="section-empty">今日のタスクがありません</div>';

  // やり残し
  const leftover = allTasks.filter(t => !isDone(t) && getProp(t,'締切日') && getProp(t,'締切日') < today);
  const leftEl = document.getElementById('leftover-list');
  leftEl.innerHTML = leftover.length
    ? leftover.map(t=>renderCard(t,'leftover')).join('')
    : '<div class="section-empty" style="color:var(--green)">やり残しなし 🎉</div>';

  // 次やること（ピン済みも表示して取り消しボタンを出す）
  const nextTasks = allTasks.filter(t => !isDone(t) && gtdNext(t));
  const nextEl = document.getElementById('next-list');
  nextEl.innerHTML = nextTasks.length
    ? nextTasks.map(t=>renderCard(t,'next')).join('')
    : '<div class="section-empty">次やるタスクがありません</div>';

  // 1日のスケジュール（実行モード）
  const blocks = {午前:[], 午後:[], 夜:[], 未設定:[]};
  allTasks.filter(t=>!isDone(t)&&taskState[t.id]?.pinned).forEach(t=>{
    const jk = taskState[t.id]?.jikantai || getProp(t,'実行時間帯') || '未設定';
    (blocks[jk]||blocks['未設定']).push(t);
  });
  const dsEl = document.getElementById('day-schedule-content');
  const blockLabels = {午前:'🌅 午前', 午後:'🌇 午後', 夜:'🌙 夜', 未設定:'⬜ 時間帯未設定'};
  let html = '';
  Object.entries(blocks).forEach(([key, tasks]) => {
    if (!tasks.length) return;
    html += `<div class="time-block">
      <div class="time-block-label">${blockLabels[key]}</div>
      ${tasks.map(t=>renderCard(t,'exec')).join('')}
    </div>`;
  });
  dsEl.innerHTML = html || '<div class="section-empty">タスクがありません</div>';
}

function updateProgress() {
  const isDoneTask = t => taskState[t.id]?.done || getProp(t,'ステータス')==='完了';
  const active = allTasks.filter(t=>getProp(t,'GTD 種別')!=='🗑ゴミ箱'&&getProp(t,'GTD 種別')!=='📥 INBOX');
  const done = active.filter(isDoneTask).length;
  const pct = active.length ? Math.round(done/active.length*100) : 0;
  document.getElementById('prog-total').textContent = pct+'%';
  document.getElementById('prog-total-sub').textContent = `${done}/${active.length}完了`;
  document.getElementById('prog-total-fill').style.width = pct+'%';

  const kadai = active.filter(t=>getProp(t,'エリア')==='課題');
  const kdone = kadai.filter(isDoneTask).length;
  const kpct = kadai.length ? Math.round(kdone/kadai.length*100) : 0;
  document.getElementById('prog-task').textContent = kpct+'%';
  document.getElementById('prog-task-sub').textContent = `${kdone}/${kadai.length}完了`;
  document.getElementById('prog-task-fill').style.width = kpct+'%';

  const other = active.filter(t=>getProp(t,'エリア')!=='課題');
  const odone = other.filter(isDoneTask).length;
  const opct = other.length ? Math.round(odone/other.length*100) : 0;
  document.getElementById('prog-other').textContent = opct+'%';
  document.getElementById('prog-other-sub').textContent = `${odone}/${other.length}完了`;
  document.getElementById('prog-other-fill').style.width = opct+'%';
}

// ===== インタラクション =====
function chTime(id, d) {
  if (!taskState[id]) return;
  taskState[id].timeIdx = Math.max(0, Math.min(4, taskState[id].timeIdx+d));
  document.querySelectorAll(`#tv-${id}`).forEach(el=>el.textContent=timeSteps[taskState[id].timeIdx]);
}

function toggleDone(id) {
  if (!taskState[id]) return;
  taskState[id].done = !taskState[id].done;
  const isDone = taskState[id].done;
  document.querySelectorAll(`#tc-${id}`).forEach(el=>el.classList.toggle('done',isDone));
  document.querySelectorAll(`#tt-${id}`).forEach(el=>el.classList.toggle('done',isDone));
  document.querySelectorAll(`#done-${id}`).forEach(el=>{
    el.textContent = isDone?'取り消し':'完了';
    el.classList.toggle('undo',isDone);
  });
  document.querySelectorAll(`#start-${id}`).forEach(el=>el.style.display=isDone?'none':'');
  // Notionに反映
  notionUpdate(id, {'ステータス':{status:{name:isDone?'完了':'ToDo'}}}).catch(console.error);
  updateProgress();
}

function togglePin(id) {
  if (!taskState[id]) return;
  taskState[id].pinned = !taskState[id].pinned;
  // 時間帯が未設定なら時間帯選択を促す
  if (taskState[id].pinned && !taskState[id].jikantai) {
    setTimeout(()=>toggleTimeDropdown(id), 200);
  }
  renderAll();
}

function toggleTimeDropdown(id) {
  document.querySelectorAll('.time-dropdown').forEach(el=>{
    if (el.id !== `tdd-${id}`) el.classList.remove('open');
  });
  const el = document.getElementById(`tdd-${id}`);
  if (el) el.classList.toggle('open');
}

function setJikantai(id, val) {
  if (!taskState[id]) return;
  taskState[id].jikantai = val;
  const el = document.getElementById(`tdd-${id}`);
  if (el) el.classList.remove('open');
  notionUpdate(id, {'実行時間帯':{select:{name:val}}}).catch(console.error);
  renderAll();
}

// クリックで閉じる
document.addEventListener('click', e => {
  if (!e.target.closest('.btn-time')) {
    document.querySelectorAll('.time-dropdown').forEach(el=>el.classList.remove('open'));
  }
});

// ===== 集中モード =====
let focusInterval = null;
let currentFocusId = null;

function startFocus(id) {
  const task = allTasks.find(t=>t.id===id);
  if (!task) return;
  if (!taskState[id]) return;
  const s = taskState[id];

  const title = getProp(task,'タイトル') || '無題';
  const area = getProp(task,'エリア');
  const subjects = getProp(task,'科目')||[];
  const at = areaTag(area,subjects);
  const link = s.link || getProp(task,'作業リンク');
  const expected = timeSteps[s.timeIdx];

  document.getElementById('focus-task').textContent = title;
  document.getElementById('focus-tags').innerHTML = `<span class="tag ${at.cls}">${at.label}</span>`;
  document.getElementById('focus-expected').textContent = `想定時間：${expected}`;

  const linkEl = document.getElementById('focus-link');
  if (link) {
    linkEl.href = link; linkEl.classList.add('show');
  } else {
    linkEl.classList.remove('show');
  }

  document.getElementById('focus-overlay').classList.add('open');
  currentFocusId = id;

  clearInterval(focusInterval);
  focusInterval = setInterval(() => {
    taskState[id].focusSeconds++;
    const m = String(Math.floor(taskState[id].focusSeconds/60)).padStart(2,'0');
    const sec = String(taskState[id].focusSeconds%60).padStart(2,'0');
    document.getElementById('focus-timer').textContent = m+':'+sec;
  }, 1000);
}

function pauseFocus() {
  clearInterval(focusInterval);
  focusInterval = null;
  document.getElementById('focus-overlay').classList.remove('open');
  if (currentFocusId) {
    document.querySelectorAll(`#start-${currentFocusId}`).forEach(el=>{
      el.textContent = 'Restart';
      el.classList.add('restart');
    });
  }
}

function completeFocus() {
  clearInterval(focusInterval);
  document.getElementById('focus-overlay').classList.remove('open');
  if (currentFocusId) toggleDone(currentFocusId);
  currentFocusId = null;
}

// ===== モード切替 =====
function setMode(mode) {
  const isSelect = mode === 'select';
  document.getElementById('select-bottom').classList.toggle('hidden', !isSelect);
  document.getElementById('exec-bottom').classList.toggle('hidden', isSelect);
  document.getElementById('btn-select').classList.toggle('active', isSelect);
  document.getElementById('btn-exec').classList.toggle('active', !isSelect);
  renderAll();
}

// ===== モーダル =====
function openModal(type) {
  document.getElementById(`modal-${type}`).classList.add('open');
  setTimeout(()=>document.getElementById(`${type}-input`)?.focus(),50);
}
function closeModal(type) {
  document.getElementById(`modal-${type}`).classList.remove('open');
}
async function addToInbox() {
  const title = document.getElementById('inbox-input').value.trim();
  if (!title) return;
  try {
    await notionCreate(DB.tasks, {
      'タイトル':{title:[{text:{content:title}}]},
      'GTD 種別':{status:{name:'📥 INBOX'}},
    });
    document.getElementById('inbox-input').value = '';
    closeModal('inbox');
    await loadTasks();
  } catch(e) { console.error(e); }
}

// ===== 起動 =====
window.onload = () => {
  setupBanner();
  setupHeader();
  setupCalendar();
  loadTasks();
};
</script>
</body>
